services:
  postgres:
    image: postgres:18-alpine
    container_name: opsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsphere
      POSTGRES_PASSWORD: opsphere
      POSTGRES_DB: opsphere
    ports:
      - '${POSTGRES_PORT:-5454}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opsphere -d opsphere']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
